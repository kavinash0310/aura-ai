name: Backend and AI service verification

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: mvn -B -ntp -f backend/pom.xml verify

  verify-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Verify AI service
        run: uv run pytest
      - name: Check Python style
        run: uv run ruff check src tests

  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify web workspace
        run: npm test
      - name: Type-check and build web workspace
        run: npm run build

  verify-compose:
    runs-on: ubuntu-latest
    env:
      AURA_DB_NAME: aura_ci
      AURA_DB_USER: aura_ci
      AURA_DB_PASSWORD: test-only-not-a-real-password-000000000000
      AURA_AUTH_USERNAME: owner
      AURA_AUTH_PASSWORD: test-only-not-a-real-password-000000000000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build the AI and web images
        run: docker compose build ai web
