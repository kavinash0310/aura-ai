global:
  scrape_interval: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/aura.yml

scrape_configs:
  - job_name: aura-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
