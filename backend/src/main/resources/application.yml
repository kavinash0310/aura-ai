spring:
  application:
    name: aura-api
  datasource:
    url: ${AURA_DB_URL}
    username: ${AURA_DB_USER}
    password: ${AURA_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  address: ${AURA_SERVER_ADDRESS:127.0.0.1}
  port: 8080
  error:
    include-message: never
aura:
  auth:
    username: ${AURA_AUTH_USERNAME}
    password: ${AURA_AUTH_PASSWORD}
