[project]
name = "aura-ai-service"
version = "0.1.0"
description = "A narrow, policy-constrained AI service for AURA"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.140.6,<0.163",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


